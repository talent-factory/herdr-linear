[package]
name = "herdr-linear"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Rust-based Linear.app plugin for Herdr — interact with Linear's GraphQL API"
repository = "https://github.com/talent-factory/herdr-linear"
readme = "README.md"

[dependencies]
# HTTP client
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GraphQL
graphql_client = "0.13"

# Async/Await utilities
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment variables
dotenvy = "0.15"

# CLI utilities (optional, for future CLI expansion)
clap = { version = "4.4", features = ["derive"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[features]
default = []
cli = ["clap"]

[[bin]]
name = "herdr-linear"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
