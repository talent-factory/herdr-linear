[package]
name = "herdr-linear"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Rust-based Linear.app plugin for Herdr — interact with Linear's GraphQL API"
repository = "https://github.com/talent-factory/herdr-linear"
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
graphql_client = "0.13"
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# Plugin binary only (enabled via the `plugin` feature)
ratatui = { version = "0.30.1", optional = true }
crossterm = { version = "0.29.0", optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"], optional = true }
open = { version = "5", optional = true }
tui-markdown = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3"

[features]
default = []
plugin = ["ratatui", "crossterm", "toml", "open", "tui-markdown"]

[[bin]]
name = "herdr-linear"
path = "src/main.rs"
required-features = ["plugin"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
