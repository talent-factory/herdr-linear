[package]
name = "herdr-linear"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Rust-based Linear.app plugin for Herdr — interact with Linear's GraphQL API"
repository = "https://github.com/talent-factory/herdr-linear"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Plugin binary only (enabled via the `plugin` feature)
ratatui = { version = "0.30.1", optional = true }
crossterm = { version = "0.29.0", optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"], optional = true }
open = { version = "5", optional = true }
tui-markdown = { version = "0.3", default-features = false, optional = true }
unicode-width = { version = "0.2", optional = true }

[dev-dependencies]
mockito = "1.2"
tempfile = "3"
criterion = { version = "0.7", features = ["async_tokio"] }

[features]
default = []
plugin = ["ratatui", "crossterm", "toml", "open", "tui-markdown", "unicode-width"]

[[bin]]
name = "herdr-linear"
path = "src/main.rs"
required-features = ["plugin"]

# `harness = false` swaps out libtest for criterion's own runner. Without it,
# `cargo test`/clippy's `--all-targets` would try to compile+run these as
# plain `#[test]` functions instead of criterion benchmarks. This is also
# what keeps them out of the normal `cargo test`/CI loop: `cargo test` never
# builds or runs `[[bench]]` targets unless invoked with `--benches`/
# `--all-targets`, and `just test`/CI's `cargo test --all-features` don't
# pass those flags. Run them explicitly with `cargo bench` — see
# `benches/README.md`.
[[bench]]
name = "pagination"
harness = false

[[bench]]
name = "batch_execution"
harness = false

[[bench]]
name = "rate_limit_retry"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
